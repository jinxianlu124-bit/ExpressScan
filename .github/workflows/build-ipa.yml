name: Build ExpressScan IPA (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-26
    env:
      LOG: build-ipa.log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          set -o pipefail
          {
            xcodebuild -version
            echo
            xcodebuild -list -project ExpressScanIOS/ExpressScan.xcodeproj
          } 2>&1 | tee -a "$LOG"

      - name: Build (no code signing)
        run: |
          set -o pipefail
          {
            xcodebuild build \
              -project ExpressScanIOS/ExpressScan.xcodeproj \
              -scheme ExpressScan \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/dd \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ONLY_ACTIVE_ARCH=NO
          } 2>&1 | tee -a "$LOG"

      - name: Package IPA
        run: |
          set -o pipefail
          {
            APP="build/dd/Build/Products/Release-iphoneos/ExpressScan.app"
            test -d "$APP"
            rm -rf build/payload
            mkdir -p build/payload/Payload out
            cp -R "$APP" build/payload/Payload/
            ( cd build/payload && zip -qry ../ExpressScan-unsigned.ipa Payload )
            cp build/ExpressScan-unsigned.ipa out/
            unzip -l out/ExpressScan-unsigned.ipa | head -20
            ls -la out
          } 2>&1 | tee -a "$LOG"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExpressScan-unsigned-ipa
          path: out/*.ipa
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            if ! ls out/*.ipa >/dev/null 2>&1; then echo "no ipa produced"; exit 1; fi
            TAG="unsigned-${{ github.run_number }}"
            gh release create "$TAG" out/ExpressScan-unsigned.ipa \
              --title "ExpressScan 未签名 IPA #${{ github.run_number }}" \
              --notes "未签名包，需用证书重签后才能安装。commit ${{ github.sha }}" \
              --target "${{ github.sha }}"
          } 2>&1 | tee -a "$LOG"

      - name: Publish build log to issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-ipa.log', 'utf8'); } catch (e) { log = '(no log file)'; }
            const errorLines = log.split('\n').filter(l => l.includes('error:') || l.includes('Error:')).slice(0, 100).join('\n');
            const tail = log.slice(-5000);
            const body = ['**Status:** ${{ job.status }}  |  **Run:** #${{ github.run_number }}', '', '```', errorLines || '(no error: lines)', '```', '', '--- tail ---', '```', tail, '```'].join('\n');
            const title = 'CI build log';
            const list = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = list.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
