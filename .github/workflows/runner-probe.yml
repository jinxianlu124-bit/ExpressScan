name: Runner probe

on:
  push:
    branches: [ ci/probe ]
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: ubuntu hello
        run: |
          echo "ubuntu runner ok"
          uname -a
  macos:
    runs-on: macos-latest
    steps:
      - name: macos hello
        run: |
          echo "macos runner ok"
          sw_vers
          xcodebuild -version
